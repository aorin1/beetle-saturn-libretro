name: Build Android ARM64 Beetle Saturn

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit hash to build'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: libretro/beetle-saturn-libretro
          ref: ${{ github.event.inputs.commit }}
          fetch-depth: 0

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build ARM64 core
        run: |
          cd jni
          ndk-build APP_ABI=arm64-v8a

      - name: Package core
        run: |
          mkdir -p artifact
          find . -name "*.so"
          cp $(find . -name "*.so" | head -n 1) artifact/mednafen_saturn_libretro_android.so

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: mednafen_saturn_libretro_android_arm64
          path: artifact/mednafen_saturn_libretro_android.so
